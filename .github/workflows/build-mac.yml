name: Build Mac App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg Kur (Mac için)
      run: |
        export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
        brew install ffmpeg

    - name: Bağımlılıkları Yükle
      run: |
        cd backend
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        pip install pyinstaller

    - name: PyInstaller ile Mac Uygulaması Üret
      run: |
        cd backend
        source venv/bin/activate
        pyinstaller --onedir --add-data "dist:dist" main.py

    - name: Dosyayı Arşivle (.zip yap)
      run: |
        cd backend/dist
        zip -r ../../kalia-mac.zip .
        
    - name: Üretilen Mac Dosyasını İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: Mac-App
        path: kalia-mac.zip
